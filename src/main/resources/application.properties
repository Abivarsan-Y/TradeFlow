spring.application.name=trade-japan-function3
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/function3}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
app.jwt-secret=${JWT_SECRET}
app.jwt-issuer=${JWT_ISSUER:trade-japan}
app.invoice-directory=${INVOICE_DIRECTORY:./private-invoices}
server.error.include-message=never
