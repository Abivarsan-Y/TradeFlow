spring.application.name=TradeFlow

# Load private settings from local.properties
spring.config.import=optional:file:./local.properties

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/tradejapan
spring.datasource.username=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TradeFlow Web Server
server.port=8081