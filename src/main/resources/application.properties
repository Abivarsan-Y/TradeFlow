spring.application.name=tradeflow

# Local Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/tradeflow
spring.datasource.username=root
spring.datasource.password=

# Tells Spring Boot to run your schema.sql and data.sql files
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
# Academic requirement: do NOT let Hibernate generate/update tables.
# Tables and seed data come from schema.sql and data.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Run schema.sql then data.sql on startup (Spring Boot SQL init).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false

server.port=8080
