spring.application.name=tradejapan

# ── Your private settings ─────────────────────────────────────
# Anything you write in local.properties (next to pom.xml) overrides the values in this file.
# local.properties is NOT uploaded to GitHub, so put your real passwords and secrets there.
# See local.properties.example for what to put in it.
spring.config.import=optional:file:./local.properties

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/tradejapan?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Academic requirement: Hibernate must NOT create or change tables.
# ALL tables come from schema.sql, and the seed data from data.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Run schema.sql (all tables) then data.sql (seed data) on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ── JWT (Rahman's auth module) ────────────────────────────────
# This is only a development value. Put your own random text (at least 64 characters) in local.properties.
app.jwt.secret=dev-only-secret-CHANGE-THIS-in-local.properties-before-publishing-0123456789
app.jwt.expiration-ms=86400000

# ── First Super Admin account (created automatically when the app starts and no such user exists) ──
# Default for development only. Set your own password in local.properties.
app.superadmin.password=superadmin123

# ── Website settings ──────────────────────────────────────────
# WhatsApp number for the "WhatsApp" button on vehicle pages: country code + number, digits only
# (example: 94771234567). While it is empty the WhatsApp button is hidden.
app.whatsapp-number=

# ── Server ────────────────────────────────────────────────────
server.port=8081

# ── File uploads (invoice PDFs up to 5 MB) ───────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
