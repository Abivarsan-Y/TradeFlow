<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* ── BIG HERO CAROUSEL ── */
        #heroCarousel {
            width: 100%;
            height: 100vh;
            max-height: 700px;
            position: relative;
            background: #0d1b2a;
        }
        #heroCarousel .carousel-inner,
        #heroCarousel .carousel-item {
            height: 100%;
        }
        .hero-slide {
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        .hero-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(10,20,40,0.72) 45%, rgba(10,20,40,0.18) 100%);
        }
        .hero-slide-content {
            position: absolute;
            bottom: 80px;
            left: 60px;
            color: #fff;
            max-width: 520px;
        }
        .hero-slide-content h1 {
            font-size: clamp(1.8rem, 3.5vw, 3rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .hero-slide-content .hero-sub {
            font-size: 0.95rem;
            opacity: 0.82;
            margin-bottom: 24px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .hero-slide-content .hero-sub span::before {
            content: '· ';
        }
        .hero-slide-content .hero-sub span:first-child::before {
            content: '';
        }
        .hero-btn-wrap {
            position: absolute;
            bottom: 80px;
            right: 60px;
        }
        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--tj-primary, #8b0000);
            color: #fff;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background .2s;
        }
        .hero-btn:hover { background: #a00000; color: #fff; }

        /* dots blended into bottom of banner */
        #heroCarousel .carousel-indicators {
            bottom: 18px;
            margin-bottom: 0;
        }
        #heroCarousel .carousel-indicators [data-bs-target] {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: none;
            transition: background .3s;
        }
        #heroCarousel .carousel-indicators .active {
            background: #fff;
        }


        /* fallback when no BIG banners */
        .hero-fallback {
            height: 100%;
            display: flex;
            align-items: flex-end;
            padding: 80px 60px;
            background: linear-gradient(to right, #0d1b2a 45%, #1a2e45 100%);
            color: #fff;
        }

        /* ── SMALL CAROUSEL (promo cards) ── */
        .promo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 24px;
        }
        .small-carousel-wrap {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            height: 260px;
            background: #0d1b2a;
        }
        .small-carousel-wrap .carousel,
        .small-carousel-wrap .carousel-inner,
        .small-carousel-wrap .carousel-item {
            height: 100%;
        }
        .promo-slide {
            height: 100%;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .promo-slide::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,20,40,0.80) 40%, rgba(10,20,40,0.25) 100%);
        }
        .promo-slide-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            max-width: 90%;
        }
        .promo-slide-content h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .promo-slide-content p {
            font-size: 0.82rem;
            opacity: 0.85;
            margin-bottom: 10px;
        }
        .promo-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--tj-primary, #8b0000);
            color: #fff;
            padding: 6px 16px;
            border-radius: 5px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
        }
        .promo-btn:hover { background: #a00000; color: #fff; }

        /* small carousel dots */
        .small-carousel-wrap .carousel-indicators {
            bottom: 8px;
            margin-bottom: 0;
        }
        .small-carousel-wrap .carousel-indicators [data-bs-target] {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            border: none;
        }
        .small-carousel-wrap .carousel-indicators .active {
            background: #fff;
        }
        .small-carousel-wrap .carousel-control-prev,
        .small-carousel-wrap .carousel-control-next { display: none; }

        /* fallback promo card (no banners yet) */
        .promo-card-fallback {
            height: 260px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }
        .promo-card-fallback::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,20,40,0.80) 40%, rgba(10,20,40,0.25) 100%);
        }
        .promo-card-fallback-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
        }
        .promo-card-fallback-content h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .promo-card-fallback-content p  { font-size: 0.82rem; opacity: 0.85; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div id="navbar"></div>
    <main class="page-body">

        <!-- ── BIG HERO CAROUSEL ── -->
        <div id="heroCarousel" class="carousel slide" data-bs-interval="2500">
            <div class="carousel-indicators" id="hero-indicators"></div>
            <div class="carousel-inner" id="hero-slides"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <!-- ── NEW ARRIVALS ── -->
        <div class="home-section">
            <div class="section-header">
                <h2 class="section-title">New Arrivals</h2>
                <a href="/pages/inventory.html" class="btn-tj-navy">View All <i class="bi bi-arrow-right"></i></a>
            </div>
            <div class="vehicle-grid" id="new-arrivals-grid">
                <div class="vehicle-empty"><i class="bi bi-arrow-clockwise"></i> Loading vehicles...</div>
            </div>

            <!-- ── SMALL CAROUSELS ── -->
            <div class="promo-grid">
                <div id="promoLeft"></div>
                <div id="promoRight"></div>
            </div>
        </div>

        <!-- ── CUSTOMER TESTIMONIALS ── -->
        <div class="home-section">
            <div class="section-header">
                <h2 class="section-title">What Our Customers Say</h2>
                <a href="/pages/submit-testimonial.html" class="btn-tj-navy">Share Your Experience <i class="bi bi-arrow-right"></i></a>
            </div>
            <div class="testimonial-grid" id="testimonial-grid">
                <div class="vehicle-empty"><i class="bi bi-arrow-clockwise"></i> Loading testimonials...</div>
            </div>
        </div>

    </main>
    <div id="footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/vehicles.js"></script>
<script src="/js/engagement.js"></script>
<script>
    async function loadBanners() {
        const res = await apiFetch('/banners');
        if (!res.ok) return;

        const { big = [], small1 = [], small2 = [] } = res.data;

        buildHeroCarousel(big);
        buildSmallCarousel('promoLeft',  'smallCarousel1', small1);
        buildSmallCarousel('promoRight', 'smallCarousel2', small2);
    }

    /* ── BIG hero carousel ── */
    function buildHeroCarousel(banners) {
        const indicators = document.getElementById('hero-indicators');
        const slides     = document.getElementById('hero-slides');

        if (!banners.length) {
            // fallback hardcoded slide
            indicators.innerHTML = '';
            slides.innerHTML = `
                    <div class="carousel-item active">
                        <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=1400&q=80');">
                            <div class="hero-slide-content">
                                <h1>Quality Japanese<br>Vehicles, Delivered<br>Worldwide</h1>
                                <div class="hero-sub">
                                    <span>Trusted Japanese cars</span>
                                    <span>Competitive prices</span>
                                    <span>Global shipping</span>
                                </div>
                            </div>
                            <div class="hero-btn-wrap">
                                <a href="/pages/content.html?page=services" class="hero-btn">Details <i class="bi bi-arrow-right"></i></a>
                            </div>
                        </div>
                    </div>`;
            return;
        }

        indicators.innerHTML = banners.map((_, i) => `
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="${i}"
                    class="${i === 0 ? 'active' : ''}" aria-label="Slide ${i+1}"></button>
            `).join('');

        slides.innerHTML = banners.map((b, i) => `
                <div class="carousel-item ${i === 0 ? 'active' : ''}">
                    <div class="hero-slide" style="background-image:url('${b.imageUrl || ''}');">
                        <div class="hero-slide-content">
                            <h1>${escapeHtml(b.title || '')}</h1>
                            ${b.subtitle ? `<div class="hero-sub"><span>${escapeHtml(b.subtitle)}</span></div>` : ''}
                        </div>
                        <div class="hero-btn-wrap">
                            <a href="${b.linkUrl || '#'}"
                               target="${b.linkType === 'EXTERNAL' ? '_blank' : '_self'}"
                               class="hero-btn">${escapeHtml(b.buttonText || 'Details')} <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
            `).join('');
    }

    /* ── SMALL carousel ── */
    function buildSmallCarousel(containerId, carouselId, banners) {
        const container = document.getElementById(containerId);

        if (!banners.length) {
            // fallback hardcoded card depending on which side
            const isFallbackLeft = containerId === 'promoLeft';
            container.innerHTML = `
                    <div class="promo-card-fallback" style="background-image:url('${
                isFallbackLeft
                    ? 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=700&q=80'
                    : 'https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=700&q=80'
            }');">
                        <div class="promo-card-fallback-content">
                            <h3>${isFallbackLeft ? 'Japanese Car Auctions' : 'Safe &amp; Reliable Global Shipping'}</h3>
                            <p>${isFallbackLeft ? 'Access the best deals from trusted auction houses in Japan.' : 'Your vehicle, delivered safely to your destination.'}</p>
                            <a href="${isFallbackLeft ? '/pages/content.html?page=services' : '#'}" class="promo-btn">
                                ${isFallbackLeft ? 'Details' : 'Contact Us'} <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>`;
            return;
        }

        const indicatorHtml = banners.map((_, i) => `
                <button type="button" data-bs-target="#${carouselId}" data-bs-slide-to="${i}"
                    class="${i === 0 ? 'active' : ''}" aria-label="Slide ${i+1}"></button>
            `).join('');

        const slideHtml = banners.map((b, i) => `
                <div class="carousel-item ${i === 0 ? 'active' : ''}">
                    <div class="promo-slide" style="background-image:url('${b.imageUrl || ''}');">
                        <div class="promo-slide-content">
                            <h3>${escapeHtml(b.title || '')}</h3>
                            ${b.subtitle ? `<p>${escapeHtml(b.subtitle)}</p>` : ''}
                            <a href="${b.linkUrl || '#'}"
                               target="${b.linkType === 'EXTERNAL' ? '_blank' : '_self'}"
                               class="promo-btn">${escapeHtml(b.buttonText || 'Details')} <i class="bi bi-arrow-right"></i></a>
                        </div>
                    </div>
                </div>
            `).join('');

        container.innerHTML = `
                <div class="small-carousel-wrap">
                    <div id="${carouselId}" class="carousel slide" data-bs-interval="2500">
                        <div class="carousel-indicators">${indicatorHtml}</div>
                        <div class="carousel-inner">${slideHtml}</div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#${carouselId}" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#${carouselId}" data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </div>`;

        new bootstrap.Carousel(document.getElementById(carouselId), { interval: 2500, ride: 'carousel' });
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBanners();
        loadNewArrivals('new-arrivals-grid');
        new bootstrap.Carousel(document.getElementById('heroCarousel'), { interval: 2500, ride: 'carousel' });
    });
</script>
</body>
</html>
