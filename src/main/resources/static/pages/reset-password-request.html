<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="register-container">
                <div class="login-card">
                    <h2>Reset Password</h2>
                    <p style="color:var(--tj-text-muted);margin-bottom:24px;">Enter your email address and we'll send you a reset link.</p>
                    <div id="msg" class="auth-message"></div>
                    <div class="tj-form-group">
                        <label>Email Address</label>
                        <div class="tj-input-icon">
                            <i class="bi bi-envelope input-icon-left"></i>
                            <input type="email" id="email" placeholder="Enter your account email">
                        </div>
                    </div>
                    <button class="btn-tj-primary w-100" onclick="requestReset()">Send Reset Link</button>

                    <!-- Token & New Password Section -->
                    <div id="reset-confirm-box" style="display:none;margin-top:24px;padding-top:24px;border-top:1px solid var(--tj-border);">
                        <h4 class="text-tj-navy" style="margin-bottom:16px;">Enter Token &amp; New Password</h4>
                        <div class="tj-form-group">
                            <label>Reset Token</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-key input-icon-left"></i>
                                <input type="text" id="token" placeholder="Paste your reset token">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>New Password</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-lock input-icon-left"></i>
                                <input type="password" id="new-pass" placeholder="Enter new password">
                                <button class="input-icon-right" onclick="togglePassword('new-pass')"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>Confirm New Password</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-lock input-icon-left"></i>
                                <input type="password" id="confirm-new-pass" placeholder="Re-enter new password">
                                <button class="input-icon-right" onclick="togglePassword('confirm-new-pass')"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <button class="btn-tj-primary w-100" onclick="confirmReset()">Change Password</button>
                    </div>

                    <div style="text-align:center;margin-top:20px;">
                        <a href="/js/pagesges/login.html" style="color:var(--tj-maroon);font-weight:500;font-size:0.9rem;">
                            <i class="bi bi-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Visiting the login page always means "start fresh" --
        // clear any leftover session so the navbar doesn't show
        // a stale Logout button from a previous account.
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_role');
        localStorage.removeItem('user_name');
    </script>
    <script>
        async function requestReset() {
            const email = document.getElementById('email').value;
            const msg = document.getElementById('msg');
            if (!email) { msg.innerText = 'Please enter your email.'; return; }
            const res = await apiFetch('/auth/password-reset/request?email=' + encodeURIComponent(email), { method: 'POST' });
            if (res.ok) {
                msg.className = 'auth-message success';
                msg.innerText = res.data;
                document.getElementById('reset-confirm-box').style.display = 'block';
            } else {
                msg.className = 'auth-message';
                msg.innerText = 'Request failed. Please check your email.';
            }
        }

        async function confirmReset() {
            const token = document.getElementById('token').value;
            const np = document.getElementById('new-pass').value;
            const confirmNp = document.getElementById('confirm-new-pass').value;
            const msg = document.getElementById('msg');
            if (!token || !np || !confirmNp) { msg.innerText = 'Please fill in all fields.'; return; }
            if (np !== confirmNp) {
                msg.className = 'auth-message';
                msg.innerText = 'Passwords do not match.';
                return;
            }
            const res = await apiFetch(`/auth/password-reset/confirm?token=${encodeURIComponent(token)}&newPassword=${encodeURIComponent(np)}`, { method: 'POST' });
            if (res.ok) {
                msg.className = 'auth-message success';
                msg.innerText = 'Password reset successfully! Redirecting to login...';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                msg.className = 'auth-message';
                msg.innerText = typeof res.data === 'string' ? res.data : 'Reset failed.';
            }
        }
    </script>
</body>
</html>
