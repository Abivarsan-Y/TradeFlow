<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="tj-breadcrumb">
                <a href="/">Home</a> &nbsp;&raquo;&nbsp; My Account
            </div>
            <div class="profile-wrap">
                <!-- Profile Header Card -->
                <div class="profile-header-card">
                    <div class="profile-avatar"><i class="bi bi-person-fill"></i></div>
                    <div class="profile-info">
                        <div class="info-item">
                            <div class="info-label">Full Name</div>
                            <div class="info-value" id="p-name">—</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">WhatsApp No</div>
                            <div class="info-value" id="p-phone">—</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value" id="e">—</div>
                        </div>
                    </div>
                    <button class="profile-edit-btn" onclick="toggleEdit()"><i class="bi bi-pencil"></i> Edit</button>
                </div>

                <!-- Edit Section (hidden by default) -->
                <div id="edit-section" class="admin-card" style="display:none;">
                    <h4 class="text-tj-navy mb-3">Edit Profile</h4>
                    <div id="msg" class="auth-message"></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="tj-form-group">
                            <label>First Name</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-person input-icon-left"></i>
                                <input type="text" id="fn" placeholder="First Name">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>Last Name</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-person input-icon-left"></i>
                                <input type="text" id="ln" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>WhatsApp No</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-whatsapp input-icon-left"></i>
                                <input type="text" id="wa" placeholder="WhatsApp Number">
                            </div>
                        </div>
                    </div>
                    <button class="btn-tj-primary" onclick="updateProf()"><i class="bi bi-check-lg"></i> Update Profile</button>
                </div>

                <!-- Role indicator (hidden) -->
                <span id="r" style="display:none;"></span>

                <!-- Tabs -->
                <div class="profile-tabs">
                    <button class="tab-item active" onclick="showProfileTab('messages',this)">Message</button>
                    <button class="tab-item" onclick="showProfileTab('wishlist',this)">Wishlist</button>
                    <button class="tab-item" onclick="showProfileTab('history',this)">Purchase History</button>
                </div>

                <!-- Messages Tab -->
                <div id="tab-messages" class="profile-tab-content">
                    <!-- Loaded from /api/inquiries/me -->
                </div>

                <!-- Wishlist Tab -->
                <div id="tab-wishlist" class="profile-tab-content" style="display:none;">
                    <div class="admin-card" style="text-align:center;color:var(--tj-text-muted);padding:48px;">
                        <i class="bi bi-heart" style="font-size:2.5rem;"></i>
                        <p style="margin-top:12px;">Your wishlist is empty.</p>
                    </div>
                </div>

                <!-- Purchase History Tab -->
                <div id="tab-history" class="profile-tab-content" style="display:none;">
                    <!-- Loaded from /api/purchases/me -->
                </div>
            </div>
        </main>
        <div id="footer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/orders.js"></script>
    <script>
        async function loadProf() {
            const res = await apiFetch('/profile');
            if (res.ok) {
                document.getElementById('e').innerText = res.data.email;
                document.getElementById('r').innerText = res.data.role;
                document.getElementById('fn').value = res.data.firstName || '';
                document.getElementById('ln').value = res.data.lastName || '';
                document.getElementById('wa').value = res.data.whatsappNo || '';
                document.getElementById('p-name').innerText =
                    (res.data.firstName || '') + ' ' + (res.data.lastName || '') || '—';
                document.getElementById('p-phone').innerText = res.data.whatsappNo || '—';
            } else {
                window.location.href = '/pages/login.html';
            }
        }

        async function updateProf() {
            const req = { firstName: document.getElementById('fn').value, lastName: document.getElementById('ln').value, whatsappNo: document.getElementById('wa').value };
            const res = await apiFetch('/profile', { method: 'PUT', body: JSON.stringify(req) });
            const msg = document.getElementById('msg');
            if (res.ok) {
                msg.className = 'auth-message success';
                msg.innerText = 'Profile updated successfully!';
                loadProf();
            } else {
                msg.className = 'auth-message';
                msg.innerText = 'Update failed.';
            }
        }

        // An Admin cannot edit the profile: the Edit button is greyed out and there is no edit form.
        // The Super Admin changes admin details in Admin panel > Admins.
        function lockProfileEdit() {
            const btn = document.querySelector('.profile-edit-btn');
            if (btn) {
                btn.disabled = true;
                btn.removeAttribute('onclick');
                btn.title = 'Admin profiles are managed by the Super Admin';
            }
            document.getElementById('edit-section')?.remove();
            const note = document.createElement('div');
            note.className = 'profile-lock-note';
            note.innerHTML = '<i class="bi bi-lock"></i> Your profile is managed by the Super Admin. To change your details, ask the Super Admin (Admin panel &gt; Admins).';
            document.querySelector('.profile-header-card')?.after(note);
        }

        function toggleEdit() {
            const sec = document.getElementById('edit-section');
            sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
        }

        function showProfileTab(tabId, btn) {
            document.querySelectorAll('.profile-tab-content').forEach(el => el.style.display = 'none');
            document.getElementById('tab-' + tabId).style.display = 'block';
            document.querySelectorAll('.profile-tabs .tab-item').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadProf();
            // Admin and Super Admin accounts are not customers: no messages, wishlist or purchases to show
            if (isStaff()) {
                if (getRole() === 'ROLE_ADMIN') lockProfileEdit();   // the Super Admin may edit here, an Admin may not
                document.querySelector('.profile-tabs')?.remove();
                ['tab-messages', 'tab-wishlist', 'tab-history'].forEach(id => document.getElementById(id)?.remove());
                return;
            }
            if (getToken()) {
                loadMyInquiries();
                loadMyWishlist();
                loadMyPurchases();
            }
            // /pages/profile.html?tab=wishlist opens that tab straight away (used by the header icon)
            const wanted = new URLSearchParams(window.location.search).get('tab');
            if (wanted) {
                const btn = [...document.querySelectorAll('.profile-tabs .tab-item')]
                    .find(b => (b.getAttribute('onclick') || '').includes("'" + wanted + "'"));
                if (btn) showProfileTab(wanted, btn);
            }
        });
    </script>
</body>
</html>
