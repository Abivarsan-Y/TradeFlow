<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="register-container">
                <div class="login-card admin-login-card">
                    <!-- Logo -->
                    <div style="text-align:center;margin-bottom:24px;">
                        <i class="bi bi-car-front" style="font-size:2.5rem;color:var(--tj-navy);"></i>
                        <div style="font-size:1.2rem;font-weight:800;letter-spacing:1px;margin-top:4px;">
                            <span style="color:var(--tj-maroon);">TRADE</span>
                            <span style="color:var(--tj-navy);">JAPAN</span>
                        </div>
                        <div style="font-size:0.6rem;color:var(--tj-text-muted);letter-spacing:2px;font-weight:600;">ADMIN PANEL</div>
                    </div>

                    <h2 style="text-align:center;">Admin Login</h2>
                    <div id="msg" class="auth-message"></div>

                    <div class="tj-form-group">
                        <label>Email Address</label>
                        <div class="tj-input-icon">
                            <i class="bi bi-envelope input-icon-left"></i>
                            <input type="email" id="email" placeholder="Enter admin email">
                        </div>
                    </div>
                    <div class="tj-form-group">
                        <label>Password</label>
                        <div class="tj-input-icon">
                            <i class="bi bi-lock input-icon-left"></i>
                            <input type="password" id="pass" placeholder="Enter password">
                            <button class="input-icon-right" onclick="togglePassword('pass')"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>

                    <button class="btn-tj-primary w-100" onclick="doLogin()">Login</button>

                    <div style="text-align:center;margin-top:20px;">
                        <a href="/static" style="color:var(--tj-text-muted);font-size:0.9rem;">
                            <i class="bi bi-arrow-left"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function doLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('msg');
            msg.innerText = '';
            const res = await apiFetch('/auth/admin/login', {
                method: 'POST', body: JSON.stringify({email, password: pass})
            });
            if (res.ok) {
                setToken(res.data.token); setRole(res.data.role);
                window.location.href = 'dashboard.html';
            } else {
                msg.innerText = (res.data && res.data.message) || (typeof res.data === 'string' ? res.data : 'Login failed.');
            }
        }
        document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
