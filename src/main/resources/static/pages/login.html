<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="login-split">
                <!-- Hero Side -->
                <div class="login-hero" style="background-image:url('https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=900&q=80');">
                    <h1>Welcome Back</h1>
                    <p>Access thousands of quality Japanese vehicles</p>
                </div>
                <!-- Form Side -->
                <div class="login-form-side">
                    <div class="login-card">
                        <h2>Login</h2>
                        <div id="msg" class="auth-message"></div>
                        <div class="tj-form-group">
                            <label>Email Address</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-envelope input-icon-left"></i>
                                <input type="email" id="email" placeholder="Enter your email address">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>Password</label>
                            <div class="tj-input-icon">
                                <i class="bi bi-lock input-icon-left"></i>
                                <input type="password" id="pass" placeholder="Enter your password">
                                <button class="input-icon-right" onclick="togglePassword('pass')"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <a href="/js/pagesges/reset-password-request.html" class="forgot-link">Forgot Password?</a>
                        <button class="btn-tj-primary w-100" onclick="doLogin()">Login</button>
                        <div class="divider">OR</div>
                        <button class="google-btn">
                            <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
                            Continue with Google
                        </button>
                        <div class="bottom-link">Don't have an account? <a href="/js/pagesges/register.html">Register</a></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Visiting the login page always means "start fresh" --
        // clear any leftover session so the navbar doesn't show
        // a stale Logout button from a previous account.
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_role');
        localStorage.removeItem('user_name');
    </script>
    <script>
        async function doLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('msg');
            msg.innerText = '';
            const res = await apiFetch('/auth/login', {
                method: 'POST', body: JSON.stringify({email, password: pass})
            });
            if (res.ok) {
                setToken(res.data.token); setRole(res.data.role);
                // go back to the page the customer came from (only paths on this site)
                const back = new URLSearchParams(window.location.search).get('redirect');
                window.location.href = (back && back.startsWith('/') && !back.startsWith('//')) ? back : '/';
            } else { msg.innerText = (res.data && res.data.message) || (typeof res.data === 'string' ? res.data : 'Login failed.'); }
        }
        document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
    </script>
</body>
</html>
