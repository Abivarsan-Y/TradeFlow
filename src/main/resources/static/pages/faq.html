<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        .faq-answer.ql-editor {
            padding-left: 0;
            padding-right: 0;
            border: none;
            box-shadow: none;
            font-size: inherit;
            font-family: inherit;
            color: inherit;
            white-space: normal;
            height: auto;
            overflow: visible;
        }
        .faq-answer.ql-editor p { margin: 0; line-height: 1.6; }
        .faq-answer.ql-editor ul,
        .faq-answer.ql-editor ol { padding-left: 0; margin: 0; }
    </style>

</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="tj-breadcrumb">
                <a href="/static">Home</a> &nbsp;&raquo;&nbsp; FAQ's
            </div>
            <div class="faq-header">
                <h1>Frequently Asked Questions</h1>
                <p>Everything you need to know before buying with Trade Japan</p>
            </div>
            <div class="faq-list" id="faq-list">
                <!-- FAQs loaded dynamically -->
            </div>
        </main>
        <div id="footer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await apiFetch('/faqs');
            const list = document.getElementById('faq-list');
            if (res.ok && res.data.length > 0) {
                list.innerHTML = res.data.map((f, i) => `
                    <div class="faq-item${i === 0 ? ' active' : ''}">
                        <button class="faq-question" onclick="toggleFaq(this)">
                            <span>${f.question}</span>
                            <span class="faq-toggle">${i === 0 ? '−' : '+'}</span>
                        </button>
                        <div class="faq-answer ql-editor">${f.answer || ''}</div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<div style="text-align:center;padding:48px;color:var(--tj-text-muted);">No FAQs available at the moment.</div>';
            }
        });

        function toggleFaq(btn) {
            const item = btn.closest('.faq-item');
            const wasActive = item.classList.contains('active');
            // Close all
            document.querySelectorAll('.faq-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('.faq-toggle').textContent = '+';
            });
            // Open clicked (if it was closed)
            if (!wasActive) {
                item.classList.add('active');
                item.querySelector('.faq-toggle').textContent = '−';
            }
        }
    </script>
</body>
</html>
