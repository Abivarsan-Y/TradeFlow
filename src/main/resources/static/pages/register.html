<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Trade Japan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar"></div>
        <main class="page-body">
            <div class="register-container">
                <div class="register-card">
                    <h2>Create Your Account</h2>
                    <div id="msg" class="auth-message"></div>
                    <div class="form-row">
                        <div class="tj-form-group">
                            <label>First Name <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-person input-icon-left"></i>
                                <input type="text" id="fn" placeholder="Enter your first name">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>Last Name <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-person input-icon-left"></i>
                                <input type="text" id="ln" placeholder="Enter your last name">
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="tj-form-group">
                            <label>Email Address <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-envelope input-icon-left"></i>
                                <input type="email" id="email" placeholder="Enter your email address">
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>WhatsApp Number <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-whatsapp input-icon-left"></i>
                                <input type="tel" id="whatsapp" placeholder="Enter your WhatsApp number">
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="tj-form-group">
                            <label>Password <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-lock input-icon-left"></i>
                                <input type="password" id="pass" placeholder="Enter your password">
                                <button class="input-icon-right" onclick="togglePassword('pass')"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                        <div class="tj-form-group">
                            <label>Confirm Password <span class="required">*</span></label>
                            <div class="tj-input-icon">
                                <i class="bi bi-lock input-icon-left"></i>
                                <input type="password" id="pass2" placeholder="Confirm your password">
                                <button class="input-icon-right" onclick="togglePassword('pass2')"><i class="bi bi-eye"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="terms-check">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the <a href="/pagesntent.html?page=tc">Terms &amp; Conditions</a> <span class="required">*</span></label>
                    </div>
                    <button class="btn-tj-primary w-100" onclick="doReg()">Register</button>
                    <div class="bottom-link" style="text-align:center;margin-top:20px;color:var(--tj-text-muted);">
                        Already have an account? <a href="/js/pagesges/login.html" style="color:var(--tj-maroon);font-weight:600;">Login</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // Visiting the register page always means "start fresh" --
        // clear any leftover session so the navbar doesn't show
        // a stale Logout button from a previous account.
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_role');
        localStorage.removeItem('user_name');
    </script>
    <script>
        async function doReg() {
            const msg = document.getElementById('msg');
            msg.innerText = '';
            const pass = document.getElementById('pass').value;
            const pass2 = document.getElementById('pass2').value;
            if (pass !== pass2) { msg.innerText = 'Passwords do not match.'; return; }
            if (!document.getElementById('terms').checked) { msg.innerText = 'You must agree to the Terms & Conditions.'; return; }
            const req = {
                email: document.getElementById('email').value,
                password: pass,
                firstName: document.getElementById('fn').value,
                lastName: document.getElementById('ln').value,
                whatsappNo: document.getElementById('whatsapp').value,
                acceptedTerms: document.getElementById('terms').checked
            };
            const res = await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify(req) });
            if (res.ok) window.location.href = 'login.html';
            else msg.innerText = typeof res.data === 'string' ? res.data : 'Registration failed.';
        }
    </script>
</body>
</html>
