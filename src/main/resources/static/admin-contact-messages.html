<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin | Contact Messages</title>

    <link rel="stylesheet" href="/css/function4.css">
</head>

<body class="admin-body">

<div class="admin-layout">

    <aside class="sidebar">

        <a class="brand" href="/admin-dashboard.html">
            <strong>TRADE <span>JAPAN</span></strong>
            <small>MAKE EVERY MILES COUNT</small>
        </a>

        <div class="admin-label">Admin Panel</div>

        <nav class="side-nav">

            <a href="/admin-dashboard.html">Dashboard</a>

            <a href="#">Vehicles</a>

            <a href="#">Inquiries</a>

            <a href="/admin-testimonials.html">Testimonials</a>

            <a class="active"
               href="/admin-contact-messages.html">
                Contact Messages
            </a>

            <a href="#">Sales Summary</a>

            <a href="#">Admin Activity</a>

            <a href="#">Users</a>

            <a href="#">Settings</a>

        </nav>

    </aside>


    <main class="admin-main">

        <div class="admin-top">
            <b>Admin</b>
        </div>


        <div class="admin-content">

            <div class="admin-heading">

                <div>
                    <h1>Contact Messages</h1>

                    <p>
                        Review and manage customer inquiries
                    </p>
                </div>

            </div>


            <div class="table-card">

                <div class="tabs">

                    <button
                            class="contact-tab active"
                            data-filter="ALL"
                            data-label="All">
                        All
                    </button>

                    <button
                            class="contact-tab"
                            data-filter="NEW"
                            data-label="New">
                        New
                    </button>

                    <button
                            class="contact-tab"
                            data-filter="READ"
                            data-label="Read">
                        Read
                    </button>

                    <button
                            class="contact-tab"
                            data-filter="RESOLVED"
                            data-label="Resolved">
                        Resolved
                    </button>

                </div>


                <div class="table-wrap">

                    <table>

                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Subject</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Handled</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody id="contactMessageTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="/js/function4.js"></script>

</body>
</html>
